name: aula-et37
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    environment: &moodle_env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      MOODLE_URL: ${MOODLE_URL:-http://localhost:8080}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?Definir MOODLE_ADMIN_PASSWORD en .env}
      MOODLE_DEMO_PASSWORD: ${MOODLE_DEMO_PASSWORD:-}
      MOODLE_SMTP_HOST: ${MOODLE_SMTP_HOST:-mail:1025}
      MOODLE_NOREPLY_ADDRESS: ${MOODLE_NOREPLY_ADDRESS:-noreply@aula-et37.example}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MOODLE_MFA: ${MOODLE_MFA:-}
      JOBE_HOST: ${JOBE_HOST:-jobe}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - moodledata:/var/moodledata
    networks: [default, sandbox]
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      jobe:
        condition: service_started
    restart: unless-stopped
  mail:
    # Solo desarrollo: captura el correo saliente (confirmación de registro) sin enviarlo a Internet.
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
  jobe:
    # Sandbox where CodeRunner runs students' code (Python, C, C++, Java, PHP, JavaScript...).
    # Only on the internal "sandbox" network: no published port, no Internet, no database access.
    # Pinned by digest because the project only publishes "latest" (2026-10-04, linux/amd64).
    image: trampgeek/jobeinabox@sha256:b442c8e63f016ff33aa2b6f28c36abc8ebd30cbb39e8e025cadeec2107c5ce85
    networks: [sandbox]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    # No "no-new-privileges": Jobe switches to its unprivileged run users with sudo (runguard).
    restart: unless-stopped
  cron:
    user: www-data
    build: .
    environment: *moodle_env
    volumes:
      - moodledata:/var/moodledata
    networks: [default, sandbox]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php /var/www/moodle/admin/cli/cron.php; sleep 60; done"]
    restart: unless-stopped
networks:
  default:
  sandbox:
    # Fixed subnet: cli/security.php keeps every other private range blocked for outgoing requests.
    internal: true
    ipam:
      config:
        - subnet: 172.30.37.0/24
volumes:
  dbdata:
  moodledata:
