# Aula ET37: Apache hardening. Named zz-* so it loads after Debian's conf-enabled/security.conf.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"
    # Moodle sends X-Frame-Options itself when "allowframembedding" is off; this covers other responses.
    Header always setifempty X-Frame-Options "SAMEORIGIN"
    Header always setifempty Permissions-Policy "geolocation=(), payment=(), usb=(), camera=(self), microphone=(self)"
    Header always unset X-Powered-By
    # HSTS only when the site is served over HTTPS (production behind TLS); see docs/SECURITY.md.
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https' || %{HTTPS} == 'on'"
</IfModule>

# Nothing outside public/ is served; also refuse hidden files and common leftovers inside it.
<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(?i:bak|orig|swp|sql|log|dist|lock)$">
    Require all denied
</FilesMatch>

# Moodle's report_security "public paths" check: internal files must answer 404.
RedirectMatch 404 "(?i)/(readme|upgrade|upgrading)[^/]*\.(txt|md)$"
RedirectMatch 404 "/environment\.xml$"
RedirectMatch 404 "/db/[^/]+\.(xml|php)$"
RedirectMatch 404 "/tests/"
RedirectMatch 404 "/cli/[^/]+\.php$"
RedirectMatch 404 "/(vendor|node_modules)/"
RedirectMatch 404 "/(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml(\.dist)?|Gruntfile\.js|\.[^/]*)$"
